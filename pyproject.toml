[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locium"
version = "0.1.0"
description = "Visual explorer for an agent's memory store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "numpy>=1.26",
    "umap-learn>=0.5.5",
    "scikit-learn>=1.3",
    "squarify>=0.4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
locium = "locium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
locium = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:n_jobs value 1 overridden to 1 by setting random_state:UserWarning",
    "ignore:The default value of `copy` will change:FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
